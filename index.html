<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐾宠物六爻趣味问事</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ancient: '#E8DCCA',
                        gold: '#D4AF37',
                        dark: '#5C4B3E',
                        pet: '#F9F3E8'
                    },
                    fontFamily: {
                        kai: ['KaiTi', 'STKaiti', 'serif']
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .coin-perspective { perspective: 1000px; }
            .coin-flip { animation: coin3d 0.8s ease-in-out; }
            .loading-pulse { animation: pulse 1.2s infinite; }
            .page-fade { animation: fade 0.5s ease forwards; }
        }
        @keyframes coin3d {
            0% { transform: rotateY(0deg) rotateX(0deg); }
            100% { transform: rotateY(1080deg) rotateX(360deg); }
        }
        @keyframes pulse {
            0%,100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.05); }
        }
        @keyframes fade {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .coin {
            transform-style: preserve-3d;
            position: relative;
        }
        .coin-face {
            backface-visibility: hidden;
            position: absolute;
            width: 100%;
            height: 100%;
        }
        .coin-back {
            transform: rotateY(180deg);
        }
    </style>
</head>
<body class="bg-pet text-dark min-h-screen font-kai">
    <div class="max-w-md w-full mx-auto p-4 py-8">
        <div id="page1" class="block page-fade text-center">
            <h1 class="text-3xl font-bold mb-3">🐾 宠物六爻趣味问事</h1>
            <p class="text-sm opacity-70 mb-8">用心起卦，读懂毛孩子的小心思~</p>
            <div class="bg-white/80 rounded-2xl p-5 shadow-sm mb-6">
                <label class="block text-left mb-2 font-semibold">请输入你想咨询的问题：</label>
                <textarea 
                    id="userQuestion" 
                    class="w-full h-24 p-3 border rounded-lg outline-none focus:border-gold resize-none"
                    placeholder="例如：我家猫咪喜欢吃新罐头吗？"
                ></textarea>
            </div>
            <button onclick="start()" class="bg-gold text-white px-6 py-3 rounded-xl">
                开始摇卦占卜
            </button>
        </div>

        <div id="page2" class="hidden page-fade text-center">
            <h2 class="text-2xl font-bold mb-3">三枚铜钱起卦</h2>
            <p class="mb-4">请依次点击铜钱，完成<span class="text-red-600 font-bold">6次</span>摇卦</p>
            <p class="mb-6">剩余次数：<span id="count" class="text-xl font-bold">6</span></p>
            <div class="flex justify-center gap-6 my-10">
                <div class="coin-perspective w-20 h-20 cursor-pointer" onclick="shake(this)">
                    <div class="coin w-full h-full">
                        <div class="coin-face rounded-full bg-gradient-to-br from-amber-400 to-gold flex items-center justify-center text-white font-bold text-lg shadow-lg">乾</div>
                        <div class="coin-face coin-back rounded-full bg-gradient-to-bl from-amber-400 to-gold flex items-center justify-center text-white font-bold text-lg shadow-lg">隆</div>
                    </div>
                </div>
                <div class="coin-perspective w-20 h-20 cursor-pointer" onclick="shake(this)">
                    <div class="coin w-full h-full">
                        <div class="coin-face rounded-full bg-gradient-to-br from-amber-400 to-gold flex items-center justify-center text-white font-bold text-lg shadow-lg">通</div>
                        <div class="coin-face coin-back rounded-full bg-gradient-to-bl from-amber-400 to-gold flex items-center justify-center text-white font-bold text-lg shadow-lg">宝</div>
                    </div>
                </div>
                <div class="coin-perspective w-20 h-20 cursor-pointer" onclick="shake(this)">
                    <div class="coin w-full h-full">
                        <div class="coin-face rounded-full bg-gradient-to-br from-amber-400 to-gold flex items-center justify-center text-white font-bold text-lg shadow-lg">寳</div>
                        <div class="coin-face coin-back rounded-full bg-gradient-to-bl from-amber-400 to-gold flex items-center justify-center text-white font-bold text-lg shadow-lg">錢</div>
                    </div>
                </div>
            </div>
            <button onclick="reset()" class="mt-4 px-4 py-2 bg-gray-200 rounded-lg text-sm">返回重新输入</button>
        </div>

        <div id="page3" class="hidden page-fade text-center py-16">
            <div class="loading-pulse text-4xl mb-4">🐶🐱</div>
            <p class="text-lg">正在读取宠物的心意...</p>
            <p class="text-sm opacity-60 mt-2">AI依据六爻卦象深度解读中</p>
        </div>

        <div id="page4" class="hidden page-fade text-center">
            <h2 class="text-2xl font-bold mb-4">卦象解读结果</h2>
            <div class="bg-white/90 rounded-2xl p-5 shadow-sm text-left mb-6 min-h-[200px]">
                <div id="resultContent" class="leading-relaxed"></div>
            </div>
            <div class="flex gap-3 justify-center mb-4">
                <button onclick="copyResult()" class="bg-gold text-white px-4 py-2 rounded-lg">复制结果</button>
                <button onclick="reset()" class="bg-gray-200 px-4 py-2 rounded-lg">重新占卜</button>
            </div>
        </div>

        <div class="text-xs text-center opacity-60 mt-10">
            本工具仅为宠物趣味娱乐使用，非医疗、命理专业参考
        </div>
    </div>

    <script>
        // ============ 这里填你的后端接口地址 ============
        const API_PROXY_URL = "https://pet-liuyao-api.vercel.app/api/chat";

        const GUA64 = [
            "乾卦","坤卦","屯卦","蒙卦","需卦","讼卦","师卦","比卦",
            "小畜卦","履卦","泰卦","否卦","同人卦","大有卦","谦卦","豫卦",
            "随卦","蛊卦","临卦","观卦","噬嗑卦","贲卦","剥卦","复卦",
            "无妄卦","大畜卦","颐卦","大过卦","坎卦","离卦","咸卦","恒卦",
            "遁卦","大壮卦","晋卦","明夷卦","家人卦","睽卦","蹇卦","解卦",
            "损卦","益卦","夬卦","姤卦","萃卦","升卦","困卦","井卦",
            "革卦","鼎卦","震卦","艮卦","渐卦","归妹卦","丰卦","旅卦",
            "巽卦","兑卦","涣卦","节卦","中孚卦","小过卦","既济卦","未济卦"
        ];

        let userQuestion = "";
        let shakeCount = 6;
        let yaoList = [];

        function showPage(id){
            document.querySelectorAll('[id^="page"]').forEach(p=>p.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function start(){
            userQuestion = document.getElementById("userQuestion").value.trim();
            if(!userQuestion){alert("请输入宠物问题");return;}
            shakeCount = 6;
            yaoList = [];
            document.getElementById("count").textContent = 6;
            showPage("page2");
        }

        function getOneYao(){
            let c1 = Math.random()>0.5?1:0;
            let c2 = Math.random()>0.5?1:0;
            let c3 = Math.random()>0.5?1:0;
            let sum = c1+c2+c3;
            if(sum===3) return {yinYang:"阳",type:"老阳",symbol:"O",isDong:true};
            if(sum===0) return {yinYang:"阴",type:"老阴",symbol:"X",isDong:true};
            if(sum===2) return {yinYang:"阳",type:"少阳",symbol:"—",isDong:false};
            return {yinYang:"阴",type:"少阴",symbol:"- -",isDong:false};
        }

        function shake(el){
            if(shakeCount<=0)return;
            let coin = el.querySelector('.coin');
            coin.classList.add('coin-flip');
            setTimeout(()=>coin.classList.remove('coin-flip'),800);

            let yao = getOneYao();
            yaoList.push(yao);
            shakeCount--;
            document.getElementById("count").textContent = shakeCount;

            if(shakeCount===0){
                setTimeout(()=>{
                    showPage("page3");
                    askAI();
                },1000);
            }
        }

        function calcGuaInfo(){
            let benGua = GUA64[Math.floor(Math.random()*64)];
            let dongPos = [];
            yaoList.forEach((item,idx)=>{
                if(item.isDong) dongPos.push(idx+1);
            });
            if(dongPos.length===0) dongPos=["无"];
            let bianIdx = (GUA64.indexOf(benGua)+7)%64;
            let bianGua = GUA64[bianIdx];
            let yaoStr = yaoList.map(y=>y.symbol).join("  ");
            return {benGua,bianGua,dongPos,yaoStr};
        }

        async function askAI(){
            let guaInfo = calcGuaInfo();
            let prompt = `
你是专业宠物六爻趣味解卦师，可爱治愈口语化，不用难懂术语。
用户问题：${userQuestion}
本卦：${guaInfo.benGua}
变卦：${guaInfo.bianGua}
动爻位置：${guaInfo.dongPos.join('、')}
爻象：${guaInfo.yaoStr}

严格分三段：
1.卦象寓意
2.宠物心声（第一人称）
3.主人小贴士
控制180字内。
            `;
            try{
                let res = await fetch(API_PROXY_URL,{
                    method:"POST",
                    headers:{"Content-Type":"application/json"},
                    body:JSON.stringify({prompt})
                });
                let txt = await res.text();
                document.getElementById("resultContent").innerHTML = txt.replace(/\n/g,"<br>");
            }catch(e){
                document.getElementById("resultContent").innerText = "AI解读失败，请稍后再试";
            }
            showPage("page4");
        }

        function copyResult(){
            let t = document.getElementById("resultContent").innerText;
            navigator.clipboard.writeText(`宠物六爻问事\n问题：${userQuestion}\n解读：${t}`);
            alert("复制成功");
        }

        function reset(){
            showPage("page1");
            document.getElementById("userQuestion").value = "";
        }
    </script>
</body>
</html>
